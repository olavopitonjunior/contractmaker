name: CI

# Gate de qualidade pra todo PR + push em master.
# Fase 0 do multitenant adiciona o job `isolation` (tenant-isolation.test.ts
# contra Neon staging branch) — ver docs/kickoff-multitenant-fase0.md.

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

# Cancela runs antigos do mesmo PR/branch quando chega push novo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: typecheck + unit
    runs-on: ubuntu-latest
    # Dummy DATABASE_URL: os unit tests mockam o Prisma (src/__tests__/setup.ts),
    # mas `prisma generate`/`validate` e a instanciação do client preferem ver a var.
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
      # O datasource declara `directUrl = env("DIRECT_URL")`; sem essa var o
      # `prisma validate` falha com P1012. Dummy, igual ao DATABASE_URL.
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
      ANTHROPIC_API_KEY: test-key
      AUTH_SECRET: test-secret
      # tsc --noEmit estoura a heap padrão (~2GB) neste projeto no runner.
      # Espelha staging-ci.yml.
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # O step de lint diffa contra a base do PR. O default (fetch-depth: 1)
          # não traz base nenhuma e o diff sairia vazio — lint verde sem lintar.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Vercel usa `npm install` (workspaces npm; lockfiles pnpm não são usados pelo npm).
      - name: Install deps
        run: npm install

      # Tipos do client Prisma são pré-requisito do typecheck e dos imports nos testes.
      - name: Prisma generate
        run: npm run prisma:generate -w apps/web

      - name: Prisma schema validate
        run: npm run prisma:validate -w apps/web

      - name: Typecheck
        run: npm run typecheck -w apps/web

      - name: Unit tests
        run: npm run test -w apps/web

      # Lint SÓ nos arquivos que o PR alterou. O repo nunca teve config de
      # ESLint (issue #374), e ligar o gate no projeto inteiro abriria um
      # mutirão: a medição na adoção deu 100 achados em 50 arquivos legados.
      # O PR responde pelo que ele mexeu, que é onde ele pode regredir.
      #
      # É o ÚLTIMO step de propósito: uma falha de lint não deve esconder o
      # resultado do typecheck nem dos testes.
      #
      # Só em PR — num `push` não existe `github.base_ref` contra o que diffar.
      - name: Lint (arquivos alterados)
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail

          # `next lint --file` espera caminho relativo ao dir do app, daí o
          # corte do prefixo `apps/web/`.
          # O `git diff` fica no seu próprio comando: se ele falhar (base ruim,
          # clone raso, merge ref irresolvível), `set -e` derruba o step. Antes
          # o `|| true` cobria a pipeline inteira e transformava essa falha em
          # lista vazia → "nada a lintar" → verde. Era o mesmo modo de falha que
          # o `fetch-depth: 0` acima existe para evitar, e invisível no log.
          CHANGED=$(git diff --name-only --diff-filter=ACMR \
            "origin/${{ github.base_ref }}...HEAD")

          # Só o grep pode "falhar" legitimamente: exit 1 quando não casa nada.
          FILES=()
          while IFS= read -r f; do
            [ -n "$f" ] && FILES+=("$f")
          done < <(
            printf '%s\n' "$CHANGED" \
              | grep -E '^apps/web/.*\.(js|jsx|mjs|cjs|ts|tsx|mts|cts)$' \
              | sed 's#^apps/web/##' || true
          )

          # Sem `--file`, `next lint` linta o projeto inteiro. Sair aqui é o que
          # impede o mutirão de aparecer justo nos PRs que não tocam em código.
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "Nenhum arquivo de código alterado em apps/web — nada a lintar."
            exit 0
          fi

          echo "Lintando ${#FILES[@]} arquivo(s):"
          printf '  %s\n' "${FILES[@]}"

          # `--max-warnings=0` e não "só erro": o `core-web-vitals` eleva apenas
          # DUAS regras a error (`no-html-link-for-pages`, `no-sync-scripts`) —
          # todo o resto, `jsx-a11y` inteiro incluído, é warning. Gatear só em
          # erro deixaria passar acessibilidade, que é metade do valor disto.
          #
          # Isso só é justo porque a árvore está em ZERO achado: o legado foi
          # neutralizado no `.eslintrc.json` e em 5 supressões pontuais, então
          # nenhum PR herda dívida de arquivo que não escreveu.
          ARGS=()
          for f in "${FILES[@]}"; do ARGS+=(--file "$f"); done
          npm run lint -w apps/web -- --max-warnings=0 "${ARGS[@]}"
