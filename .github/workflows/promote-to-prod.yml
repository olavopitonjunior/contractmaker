name: Promote staging → prod

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, labeled, unlabeled]

# Menor privilégio: o job só faz `gh pr view --json labels`, que é LEITURA.
# `pull-requests: write` estava declarado e nunca era exercido.
permissions:
  contents: read
  pull-requests: read
  # `issues/{n}/events` (quando a label foi aplicada) vive na API de Issues,
  # mesmo para PR — sem este escopo o gate morreria em 403 em toda promoção.
  issues: read

# O trigger inclui `labeled`/`unlabeled`, então mexer em label várias vezes
# empilharia runs redundantes. Escopo por PR: nunca cancela o run de outro.
concurrency:
  group: promote-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Este workflow é SÓ o gate humano. Typecheck, testes e `prisma validate` de todo
# PR pra master são do `ci.yml` (job `typecheck + unit`, sem `if:`, roda em
# todos). Havia aqui um job `validate` byte-a-byte equivalente ao dele — mesmos
# env, mesmos steps — que só dobrava o tempo de CI sem acrescentar sinal.
jobs:
  require-smoke-label:
    name: Require smoke/hotfix label
    runs-on: ubuntu-latest
    # SEM `if:` de propósito. Havia aqui um `if: github.head_ref == 'staging'`,
    # e num PR vindo de qualquer outra branch o job era PULADO — o GitHub conta
    # check pulado como sucesso pra branch protection. O gate humano que existia
    # pra proteger master era exatamente o que deixava hotfix/* entrar sem
    # nenhuma aprovação manual. O gate agora vale sempre; o que muda conforme a
    # origem é QUAL label o satisfaz.
    steps:
      - name: Check label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          LABELS=$(gh pr view ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --json labels --jq '.labels[].name')

          # Promoção normal: exige o smoke feito em staging.imobpro.ia.br.
          # Hotfix: exige o label de escape, que NÃO é aceito na promoção normal
          # — senão ele viraria um bypass do smoke pro fluxo de todo dia.
          if [ "$HEAD_REF" = "staging" ]; then
            WANTED="staging-smoke-passed"
            WHY="PR de staging → master precisa de smoke test em https://staging.imobpro.ia.br antes de promover"
          else
            WANTED="hotfix-sem-smoke"
            WHY="PR de '$HEAD_REF' → master pula a homologação em staging. Aplique o label só se o risco for consciente, e faça cherry-pick na staging depois pra evitar drift"
          fi

          # `grep -qx` (linha inteira) e não `-q`: o antigo casava SUBSTRING, então
          # um label chamado "nao-staging-smoke-passed-x" satisfazia o gate.
          if ! printf '%s\n' "$LABELS" | grep -qx "$WANTED"; then
            echo "::error::Faltando o label '$WANTED'. $WHY."
            exit 1
          fi

          # A label atesta um SHA, não um PR. O head de staging → master é a
          # BRANCH `staging`: se outro merge entrar nela com a promoção aberta,
          # o head avança e a label continua lá — e código que nunca passou pelo
          # smoke chega a produção sob a label do smoke anterior (issue #591).
          # Regra: o commit do head não pode ser POSTERIOR ao momento em que a
          # label foi aplicada pela última vez. Só para a promoção normal — o
          # hotfix é consciente por definição.
          if [ "$HEAD_REF" = "staging" ]; then
            REPO="${{ github.repository }}"
            PR="${{ github.event.pull_request.number }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
            # `--paginate` aplica o --jq a CADA página e concatena: sem o `tail -n1`
            # o "last" seria o último de cada página, e a comparação usaria a
            # aplicação MAIS ANTIGA — travando justamente quem reaplicou a label.
            # (`// empty` não emite linha nenhuma sem evento; `tail` aceita vazio.)
            LABELED_AT=$(gh api "repos/$REPO/issues/$PR/events" --paginate \
              --jq "[.[] | select(.event == \"labeled\" and .label.name == \"$WANTED\")] | last | .created_at // empty" \
              | tail -n1)
            # QUANDO o head chegou à branch: o PushEvent do repositório é carimbo
            # do SERVIDOR. A data do committer não serve como primeira fonte —
            # commit feito ontem e empurrado hoje carrega a data de ontem, e
            # passaria por "anterior à label" sem ter passado pelo smoke.
            HEAD_AT=$(gh api "repos/$REPO/events" --paginate \
              --jq ".[] | select(.type == \"PushEvent\" and .payload.head == \"$HEAD_SHA\") | .created_at" \
              | head -n1)
            if [ -z "$HEAD_AT" ]; then
              # Fora da janela de eventos do repositório (90 dias / 300 eventos):
              # cai para a data do committer e diz que caiu.
              HEAD_AT=$(gh api "repos/$REPO/commits/$HEAD_SHA" --jq '.commit.committer.date')
              echo "::warning::PushEvent do head $HEAD_SHA não encontrado; usando a data do committer ($HEAD_AT) — sinal mais fraco."
            fi
            if [ -z "$LABELED_AT" ] || [ -z "$HEAD_AT" ]; then
              echo "::error::Não consegui ler quando a label foi aplicada ($LABELED_AT) ou a data do head ($HEAD_AT)."
              exit 1
            fi
            # ISO-8601 em UTC: a ordem lexicográfica é a ordem no tempo.
            if [[ "$HEAD_AT" > "$LABELED_AT" ]]; then
              echo "::error::O head ($HEAD_SHA, $HEAD_AT) avançou DEPOIS da label '$WANTED' ($LABELED_AT): a staging recebeu merge com a promoção aberta. Faça o smoke de novo, remova e reaplique a label."
              exit 1
            fi
            echo "✓ label '$WANTED' aplicada em $LABELED_AT, head de $HEAD_AT (anterior)"
            exit 0
          fi

          echo "✓ label '$WANTED' presente (head: $HEAD_REF)"
          exit 0
