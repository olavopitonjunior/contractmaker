name: Promote staging → prod

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    name: Validate (typecheck + tests)
    runs-on: ubuntu-latest
    if: github.head_ref == 'staging'
    # Repo é npm-workspaces (root package.json `workspaces`, sem pnpm-workspace.yaml).
    # Espelha ci.yml/staging-ci.yml — usa npm, não pnpm. Antes o job tentava
    # `cache: pnpm` + `pnpm install --frozen-lockfile` e falhava por não haver
    # pnpm-lock.yaml na raiz (o lockfile pnpm vive em apps/web/ e é untracked).
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
      # `prisma validate` exige DIRECT_URL (datasource declara directUrl); dummy.
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
      ANTHROPIC_API_KEY: test-key
      AUTH_SECRET: test-secret
      # tsc --noEmit estoura a heap padrão (~2GB) neste projeto no runner.
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm install

      - name: Prisma generate
        run: npm run prisma:generate -w apps/web

      - name: Prisma schema validate
        run: npm run prisma:validate -w apps/web

      - name: Type check
        run: npm run typecheck -w apps/web

      - name: Tests
        run: npm run test -w apps/web

  require-smoke-label:
    name: Require staging-smoke-passed
    runs-on: ubuntu-latest
    if: github.head_ref == 'staging'
    steps:
      - name: Check label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LABELS=$(gh pr view ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --json labels --jq '.labels[].name')
          if echo "$LABELS" | grep -q "staging-smoke-passed"; then
            echo "✓ staging-smoke-passed label present"
            exit 0
          fi
          echo "::error::PR de staging → master precisa do label 'staging-smoke-passed' aplicado manualmente após smoke test em staging.imobpro.ia.br"
          exit 1
